name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Encoding & Mojibake Check
        run: node scripts/check-encoding.mjs
      - name: TypeScript Check
        run: npm run typecheck
      - name: Next.js Build
        run: npm run build
