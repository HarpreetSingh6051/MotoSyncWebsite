<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Matte Carbon Rounded Tile -->
  <rect width="64" height="64" rx="16" fill="#0b171e"/>
  <defs>
    <linearGradient id="msFaviconRadarGrad" x1="12" y1="10" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7de0e2"/>
      <stop offset="0.6" stop-color="#9bf3aa"/>
      <stop offset="1" stop-color="#d6f66f"/>
    </linearGradient>
  </defs>

  <!-- 360° Radar Field Boundary -->
  <circle cx="32" cy="32" r="25" stroke="rgba(125,224,226,0.25)" stroke-width="1.2" stroke-dasharray="3 4"/>

  <!-- Compass Heading Tick -->
  <line x1="32" y1="2" x2="32" y2="6" stroke="#7de0e2" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Forward Heading Stealth Delta -->
