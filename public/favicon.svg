  <!-- Live Telemetry Focal Node -->
  <circle cx="32" cy="27" r="3.2" fill="#ff8a68"/>
  <circle cx="32" cy="27" r="1.3" fill="#ffffff"/>

  <!-- Orbiting Pack Beacons -->
  <circle cx="48" cy="22" r="2.8" fill="#d6f66f"/>
  <circle cx="16" cy="22" r="2.8" fill="#7de0e2"/>
</svg>
